name: CI

on:
  pull_request:
    branches: [dev, main]
  # dev push의 테스트는 CD(cd.yml)가 이 워크플로를 호출해 돌린다.
  push:
    branches: [main]
  workflow_call:

jobs:
  test:
    name: 빌드·테스트
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 테스트 실행
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: 테스트 리포트 보관
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
