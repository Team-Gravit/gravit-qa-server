name: CD

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: cd-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/ci.yml

  build:
    name: 이미지 빌드, 푸시
    needs: ci
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/gravit-qa-server
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      # 테스트는 같은 실행의 ci job이 돌았다.
      - name: JAR 빌드
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: 도커 허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # latest는 compose가 쓰고, 커밋 SHA 태그는 되돌리기용이다.
      - name: 도커 이미지 빌드
        run: docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      - name: 도커 이미지 푸시
        run: docker push --all-tags "$IMAGE"

  deploy:
    name: 앱센터 서버에 배포
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      # rm 옵션을 켜면 대상 디렉터리를 비워 .env가 사라진다.
      - name: docker-compose-qa.yml 파일 전송
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.APPCENTER_SERVER_IP }}
          username: ${{ secrets.APPCENTER_SERVER_USERNAME }}
          password: ${{ secrets.APPCENTER_SERVER_PASSWORD }}
          port: ${{ secrets.APPCENTER_SERVER_PORT }}
          source: "docker-compose-qa.yml"
          target: "/home/serverking/gravit/qa"

      - name: qa-api 갱신
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        with:
          host: ${{ secrets.APPCENTER_SERVER_IP }}
          username: ${{ secrets.APPCENTER_SERVER_USERNAME }}
          password: ${{ secrets.APPCENTER_SERVER_PASSWORD }}
          port: ${{ secrets.APPCENTER_SERVER_PORT }}
          envs: DOCKER_HUB_USERNAME
          script: |
            set -eu
            cd /home/serverking/gravit/qa

            # .env는 사람이 관리한다(외부 연동 비밀값). CD는 읽지도 쓰지도 않고,
            # 이미지 이름은 셸 환경 변수(DOCKER_HUB_USERNAME)로 넘긴다. compose 보간에서 셸 값이 .env보다 우선한다.
            if [ ! -f .env ]; then
              echo ".env가 없습니다. docs/deploy-runbook.md 2단계를 먼저 하세요."
              exit 1
            fi

            # deploy.resources.limits는 Compose v2에서만 적용된다.
            # 서버 로그인 셸(zsh)은 따옴표 없는 변수를 단어 분리하지 않아, 명령을 변수 대신 함수로 고른다.
            if docker compose version >/dev/null 2>&1; then
              compose() { docker compose "$@"; }
            elif docker-compose version --short 2>/dev/null | grep -q '^2'; then
              compose() { docker-compose "$@"; }
            else
              echo "Compose v2가 필요합니다."
              exit 1
            fi

            # LLM 게이트웨이(litellm-gw)와 통신할 외부 네트워크. 없으면 만들어 compose 기동이 막히지 않게 한다.
            docker network inspect llm-net >/dev/null 2>&1 || docker network create llm-net

            # qa-e2e는 C7 전까지 올리지 않는다.
            compose -f docker-compose-qa.yml pull qa-api
            compose -f docker-compose-qa.yml up -d --no-deps --force-recreate qa-api

            # 저장소가 public이라 Actions 로그에 컨테이너 로그를 남기지 않는다. 원인은 서버에서 docker logs로 본다.
            i=0
            until [ "$(docker inspect -f '{{.State.Health.Status}}' gravit-qa-api)" = "healthy" ]; do
              i=$((i + 1))
              if [ "$i" -ge 36 ]; then
                echo "qa-api가 180초 안에 healthy가 되지 않았습니다. 서버에서 docker logs gravit-qa-api로 확인하세요."
                exit 1
              fi
              sleep 5
            done
            echo "qa-api healthy"

            docker image prune -f
