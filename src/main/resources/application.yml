spring:
  application:
    name: gravit-qa
  datasource:
    url: ${QA_DB_URL}
    username: ${QA_DB_USERNAME}
    password: ${QA_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        size: 3
  jackson:
    time-zone: Asia/Seoul

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

qa:
  auth:
    host: ${QA_AUTH_HOST}
    timeout: 5s
    cache-ttl: 300s
  job:
    max-attempts: 4
    backoff-base: 2m
    heartbeat-timeout: 2m
    reaper-interval-ms: 60000
  worker:
    enabled: true
    id: ${QA_WORKER_ID:}
    job-types: []
    poll-interval-ms: 5000
    heartbeat-interval-ms: 30000
